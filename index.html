<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="上海中考倒计时：每日励志背景图，体育、外语听说与理化实验、正式考试三级倒计时，附考试安排与总分构成。">
<title>上海中考倒计时</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#c93b28" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="中考倒计时">
<style>
  :root{
    --bg:#eceff4; --surface:#ffffff; --surface-2:#f6f7fa; --surface-3:#eef1f5;
    --line:#dbdfe6; --line-strong:#c5cbd5;
    --text:#111721; --text-2:#48515f; --muted:#78818f;
    --accent:#c93b28; --accent-ink:#a82e1d; --accent-soft:#fdeae6;
    --teal:#0d6f6f; --teal-soft:#e5f1f0;
    --ok:#2c7a5b; --ok-soft:#e7f2ec;
    --warn:#8a5b0c; --warn-soft:#faf0db;
    --shadow:0 1px 2px rgba(17,23,33,.05), 0 10px 30px -22px rgba(17,23,33,.4);
    --radius:8px; --radius-sm:6px;
  }
  html[data-theme="dark"]{
    --bg:#0b0e13; --surface:#141a23; --surface-2:#1a212b; --surface-3:#202834;
    --line:#252e3a; --line-strong:#36414f;
    --text:#eef1f6; --text-2:#b4bdc9; --muted:#8b95a3;
    --accent:#f2604c; --accent-ink:#ff8672; --accent-soft:#2c1714;
    --teal:#41aaa6; --teal-soft:#0f2727;
    --ok:#4cb185; --ok-soft:#12241d;
    --warn:#d3a354; --warn-soft:#261f11;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 40px -24px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    padding:0 max(16px, env(safe-area-inset-left)) calc(56px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  }
  @media (display-mode:standalone){
    body{padding-top:calc(10px + env(safe-area-inset-top))}
  }
  .wrap{max-width:1000px; margin:0 auto}
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  button{font:inherit; color:inherit; cursor:pointer}
  h1,h2,h3{margin:0; font-weight:650; letter-spacing:0}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex; align-items:center; gap:12px; padding:18px 2px 14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:9px; min-width:0}
  .brand .mark{
    width:30px; height:30px; border-radius:7px; display:grid; place-items:center;
    background:var(--accent); color:#fff; flex:0 0 auto;
  }
  .brand h1{font-size:16px; white-space:nowrap}
  .brand .sub{font-size:12px; color:var(--muted); white-space:nowrap}
  .spacer{flex:1 1 auto}
  .iconbtn{
    width:36px; height:36px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--surface);
    display:inline-grid; place-items:center; color:var(--text-2);
    transition:background .15s, border-color .15s, color .15s;
  }
  .iconbtn:hover{background:var(--surface-2); color:var(--text); border-color:var(--line-strong)}
  .iconbtn:active{transform:translateY(1px)}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:18px;
  }
  .card + .card, .levels + .card, .card + .levels{margin-top:16px}
  .card-head{display:flex; align-items:center; gap:9px; margin-bottom:14px; flex-wrap:wrap}
  .card-head h2{font-size:14px; font-weight:600; color:var(--text-2)}
  .card-head svg{color:var(--muted); flex:0 0 auto}
  .card-head .right{margin-left:auto; display:flex; align-items:center; gap:8px}

  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px;
    border:1px solid transparent; white-space:nowrap;
  }
  .chip.tight{gap:0}
  .chip.wait{background:var(--surface-2); color:var(--muted); border-color:var(--line)}
  .chip.done{background:var(--ok-soft); color:var(--ok)}
  .chip.soft{background:var(--teal-soft); color:var(--teal)}
  .chip.step{background:var(--accent-soft); color:var(--accent-ink); border-color:currentColor; font-weight:650}
  .chip.step.s2{background:var(--teal-soft); color:var(--teal)}
  .chip.step.s3{background:var(--ok-soft); color:var(--ok)}

  /* ---------- 三级倒计时 ---------- */
  /* 主视觉：每日一张励志背景图 + 倒计时 */
  .hero{
    position:relative; overflow:hidden; margin-top:16px;
    border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:24px 20px 20px; text-align:center;
    --hero-ink:#33240f; --hero-ink-2:#5b4520;
    --hero-tile:rgba(255,255,255,.94); --hero-tile-line:rgba(140,105,45,.16);
  }
  html[data-theme="dark"] .hero{
    --hero-ink:#f7f2e8; --hero-ink-2:#cdc4b4;
    --hero-tile:rgba(255,255,255,.10); --hero-tile-line:rgba(255,255,255,.18);
  }
  .hero-bg{position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat}
  .hero-veil{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,251,244,.34) 0%, rgba(255,250,240,.60) 34%, rgba(255,248,236,.82) 72%, rgba(255,247,234,.92) 100%);
  }
  html[data-theme="dark"] .hero-veil{
    background:linear-gradient(180deg, rgba(10,12,17,.56) 0%, rgba(10,12,17,.76) 34%, rgba(10,12,17,.88) 72%, rgba(10,12,17,.94) 100%);
  }
  .hero-inner{position:relative; z-index:1}
  .hero-today, .hero-title, .hero-weeks, .hero-quote{
    text-shadow:0 1px 0 rgba(255,255,255,.92), 0 0 16px rgba(255,255,255,.85);
  }
  html[data-theme="dark"] .hero-today,
  html[data-theme="dark"] .hero-title,
  html[data-theme="dark"] .hero-weeks,
  html[data-theme="dark"] .hero-quote{
    text-shadow:0 1px 0 rgba(0,0,0,.75), 0 0 16px rgba(0,0,0,.7);
  }
  .hero-today{font-size:12.5px; font-weight:500; color:var(--hero-ink-2); display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center}
  .hero-today .sep{color:rgba(140,120,90,.5)}
  .hero-title{font-size:17px; font-weight:650; color:var(--hero-ink); margin:10px 0 18px}
  .hero-title b{color:var(--accent-ink)}
  html[data-theme="dark"] .hero-title b{color:var(--accent)}
  .tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; max-width:600px; margin:0 auto}
  .tile{
    background:var(--hero-tile); border:1px solid var(--hero-tile-line);
    border-radius:14px; padding:9px 9px 6px; min-width:0;
    box-shadow:0 12px 26px -18px rgba(70,45,10,.75);
  }
  .tile .box{
    aspect-ratio:1/1; border-radius:11px; display:grid; place-items:center;
    background:linear-gradient(160deg,#f9d489 0%,#eeac48 100%);
    color:#fff; font-weight:700; font-size:38px; line-height:1;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
    text-shadow:0 1px 2px rgba(150,95,10,.25);
  }
  .tile .lab{font-size:13px; font-weight:600; color:var(--hero-ink-2); margin-top:7px}
  .hero-weeks{
    margin-top:16px; font-size:14px; color:var(--hero-ink-2);
    display:flex; gap:11px; align-items:baseline; justify-content:center; flex-wrap:wrap;
  }
  .hero-weeks b{font-size:20px; color:var(--hero-ink); font-variant-numeric:tabular-nums}
  .hero-weeks .frac{font-size:12.5px}
  .hero-quote{
    position:relative; margin:20px auto 0; max-width:560px; padding:0 34px;
    font-size:16px; font-weight:600; line-height:1.95; color:var(--hero-ink);
  }
  .hero-quote::before, .hero-quote::after{
    position:absolute; font-size:46px; line-height:1; color:rgba(216,152,62,.5); font-family:Georgia,serif;
  }
  .hero-quote::before{content:"\201C"; left:0; top:-12px}
  .hero-quote::after{content:"\201D"; right:0; bottom:-26px}
  .hero-cta{
    margin-top:24px; display:inline-flex; align-items:center; gap:9px;
    border:0; border-radius:999px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:600; padding:13px 26px;
    box-shadow:0 12px 24px -14px rgba(190,55,35,.95);
    transition:background .15s, transform .15s;
  }
  .hero-cta:hover{background:var(--accent-ink); transform:translateY(-1px)}
  .hero-cta:active{transform:translateY(0)}
  .hero-credit{font-size:11px; color:var(--hero-ink-2); opacity:.8; margin-top:16px}
  .hero-credit a{color:inherit}
  .hero-swap{
    position:absolute; right:12px; top:12px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:rgba(255,255,255,.82); border:1px solid var(--hero-tile-line);
    color:#5a4626; display:grid; place-items:center;
  }
  html[data-theme="dark"] .hero-swap{background:rgba(255,255,255,.14); color:#f2ece1}
  .hero-swap:hover{background:#fff}
  html[data-theme="dark"] .hero-swap:hover{background:rgba(255,255,255,.24)}
  .hero.is-over .tile .box{background:linear-gradient(160deg,#c9ccd2,#9aa1ab); text-shadow:none}

  .levels{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:16px}
  .lvl{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; min-width:0;
    display:flex; flex-direction:column; gap:11px;
  }
  .lvl.is-next{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow)}
  .lvl.is-past{opacity:.6}
  .lvl-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .lvl-name{font-size:14.5px; font-weight:640; line-height:1.4}
  .lvl-date{font-size:12.5px; color:var(--text-2); display:flex; gap:7px; align-items:baseline; flex-wrap:wrap}
  .lvl-date .wk{color:var(--muted)}
  .lvl-note{font-size:11.5px; color:var(--warn); background:var(--warn-soft); border-radius:6px; padding:5px 8px; line-height:1.5}
  .lvl-note.info{color:var(--text-2); background:var(--surface-2); border:1px solid var(--line)}
  .lvl .tiles{max-width:none; gap:8px}
  .lvl .tile{background:var(--surface-2); border-color:var(--line); box-shadow:none; padding:6px 6px 4px; border-radius:11px}
  .lvl .tile .box{font-size:22px; border-radius:8px}
  .lvl .tile .lab{font-size:11.5px; margin-top:5px; color:var(--muted)}
  .lvl-weeks{
    display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
    padding-top:11px; border-top:1px dashed var(--line); margin-top:auto;
  }
  .lvl-weeks .k{font-size:12px; color:var(--muted)}
  .lvl-weeks b{font-size:17px; font-weight:660; font-variant-numeric:tabular-nums}
  .lvl-weeks .frac{font-size:12px; color:var(--muted)}
  .lvl-done{font-size:15px; font-weight:620; color:var(--muted); padding:12px 0}

  /* ---------- 打气 ---------- */
  .cheer-list{
    list-style:none; margin:14px 0 0; padding:14px 0 0;
    border-top:1px dashed var(--line); display:grid; gap:8px;
  }
  .cheer-list li{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--text-2)}
  .cheer-list li::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--line-strong); flex:0 0 auto; margin-top:8px}

  /* ---------- 表格 ---------- */
  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .tbl{width:100%; border-collapse:collapse; font-size:13.5px}
  .tbl th{
    text-align:left; font-size:12px; font-weight:600; color:var(--muted);
    padding:0 10px 8px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
  }
  .tbl td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl .c-date{white-space:nowrap; font-weight:600}
  .tbl .c-time{white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--text-2)}
  .tbl .c-score{text-align:right; white-space:nowrap; font-weight:650; font-variant-numeric:tabular-nums}
  .tbl .c-sub{font-size:12px; color:var(--muted); display:block; margin-top:2px; font-weight:400}
  .tbl tfoot td{
    border-top:1px solid var(--line-strong); border-bottom:0;
    color:var(--text-2); font-size:12.5px; font-weight:600;
  }
  .tbl tfoot .c-score{font-size:14px; color:var(--text)}
  .tbl .lv-chip{margin-right:7px}

  /* ---------- 折叠分区 ---------- */
  .acc{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-top:16px; overflow:hidden;
  }
  .acc > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
    padding:16px 18px; font-size:14px; font-weight:600; color:var(--text-2);
  }
  .acc > summary::-webkit-details-marker{display:none}
  .acc > summary:hover{background:var(--surface-2)}
  .acc > summary:focus-visible{outline:2px solid var(--teal); outline-offset:-2px}
  .acc > summary > svg:first-child{flex:0 0 auto}
  .acc-title{color:var(--text); font-weight:620; min-width:0}
  .acc .chev{margin-left:auto; color:var(--muted); transition:transform .2s ease}
  .acc[open] > summary{border-bottom:1px solid var(--line)}
  .acc[open] .chev{transform:rotate(180deg)}
  .acc-body{padding:16px 18px}
  .acc-body h3{font-size:13.5px; margin:20px 0 10px; display:flex; align-items:center; gap:8px}
  .acc-body h3:first-child{margin-top:0}
  .acc-note{margin:10px 0 0; font-size:12px; color:var(--muted); line-height:1.75}
  .pe-list{margin:0; padding-left:19px; font-size:13.5px; color:var(--text-2); line-height:1.85}
  .pe-list li{margin:3px 0}
  .pe-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
  .pe-head .pe-hint{font-size:11.5px; color:var(--muted)}
  /* 宽表格：横向滑动，首列固定 */
  .tbl.wide{width:max-content; min-width:100%}
  .tbl.wide th, .tbl.wide td{text-align:center; white-space:nowrap; padding:7px 9px}
  .tbl.wide th:first-child, .tbl.wide td:first-child{
    position:sticky; left:0; z-index:1; background:var(--surface);
    font-weight:650; box-shadow:1px 0 0 var(--line);
  }
  .tbl.wide tbody tr:nth-child(-n+4) td:first-child{color:var(--accent-ink)}

  /* ---------- 弹层 ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,14,20,.5);
    display:flex; justify-content:center; align-items:flex-start;
    padding:24px 16px; overflow-y:auto; z-index:50; backdrop-filter:blur(2px);
  }
  .overlay[hidden]{display:none}
  .sheet{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    width:100%; max-width:700px; box-shadow:0 30px 70px -30px rgba(0,0,0,.6); margin:auto;
  }
  .sheet-head{
    display:flex; align-items:center; gap:10px; padding:16px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; z-index:2;
  }
  .sheet-head h2{font-size:16px}
  .sheet-body{padding:18px; display:grid; gap:22px}
  .sheet-foot{
    display:flex; gap:10px; justify-content:flex-end; align-items:center;
    padding:14px 18px; border-top:1px solid var(--line);
    position:sticky; bottom:0; background:var(--surface);
    border-radius:0 0 var(--radius) var(--radius); flex-wrap:wrap;
  }
  .sect > h3{font-size:13.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px}
  .sect > h3 svg{color:var(--muted)}
  .hint{font-size:12px; color:var(--muted); margin-top:9px; line-height:1.7}
  .mrow{
    display:grid; grid-template-columns:minmax(0,1.3fr) minmax(160px,1fr) auto;
    gap:10px; align-items:end; padding:12px;
    border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2);
  }
  .mrow + .mrow{margin-top:10px}
  .mrow .wide{grid-column:1/-1}
  .mrow label{display:block; min-width:0}
  .mrow label > span{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
  .chk{display:flex !important; align-items:center; gap:7px; padding-bottom:8px}
  .chk input{width:auto; margin:0}
  .chk > span{margin:0 !important; font-size:12.5px !important; color:var(--text-2) !important; white-space:nowrap}

  /* ---------- 表单元素 ---------- */
  input[type=text],input[type=datetime-local]{
    font:inherit; font-size:13.5px; color:var(--text);
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:8px 9px; min-width:0; width:100%;
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    border-radius:var(--radius-sm); padding:8px 13px; font-size:13.5px; font-weight:550;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{background:var(--surface-3); border-color:var(--line-strong)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink)}
  .btn.danger{color:var(--accent-ink); border-color:var(--accent-soft); background:var(--accent-soft)}
  .btn.small{padding:6px 10px; font-size:12.5px}
  .seg{display:inline-flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm)}
  .seg button{
    border:0; background:transparent; color:var(--text-2);
    padding:6px 12px; border-radius:4px; font-size:13px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12)}

  footer.note{font-size:12px; color:var(--muted); margin-top:18px; line-height:1.75}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

  @media (max-width:860px){
    .levels{grid-template-columns:minmax(0,1fr)}
    .hero .tile .box{font-size:32px}
    .lvl .tile .box{font-size:24px}
  }
  @media (max-width:680px){
    body{
      padding-left:max(12px, env(safe-area-inset-left));
      padding-right:max(12px, env(safe-area-inset-right));
      padding-bottom:calc(44px + env(safe-area-inset-bottom));
    }
    .card{padding:15px}
    .hero{padding:20px 14px 18px}
    .hero-title{font-size:15.5px; margin:9px 0 15px}
    .tiles{gap:8px}
    .hero .tile{padding:7px 7px 5px; border-radius:12px}
    .hero .tile .box{font-size:26px}
    .hero .tile .lab{font-size:11.5px; margin-top:5px}
    .hero-weeks b{font-size:17px}
    .hero-quote{font-size:14.5px; padding:0 26px; line-height:1.9}
    .hero-quote::before, .hero-quote::after{font-size:36px}
    .hero-cta{font-size:14px; padding:12px 20px; width:100%; max-width:330px; justify-content:center}
    .lvl .tile .box{font-size:19px}
    /* 表格转卡片式，避免横向溢出 */
    .tbl thead{display:none}
    .tbl, .tbl tbody, .tbl tfoot{display:block; width:100%}
    .tbl tr{
      display:block; border:1px solid var(--line); border-radius:var(--radius-sm);
      background:var(--surface-2); padding:6px 4px; margin-bottom:8px;
    }
    .tbl tr:last-child{margin-bottom:0}
    .tbl td{
      display:grid; grid-template-columns:58px minmax(0,1fr); gap:10px;

      '</table></div>' +

      '<h3>二、日常考核 15 分</h3>' +
      '<ul class="pe-list">' + PE_DAILY.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' +

      '<h3>三、部分项目成绩评价标准</h3>' +
      '<div class="pe-head">' +
        '<div class="seg" role="group" aria-label="选择性别">' + seg + '</div>' +
        '<span class="pe-hint">时间格式为「分:秒」；表格可左右滑动，「分值」列为百分制得分</span>' +
      '</div>' +
      '<div class="table-wrap"><table class="tbl wide">' +
        '<thead>' + head + '</thead><tbody>' + rows + '</tbody>' +
      '</table></div>' +
      '<p class="acc-note">附加分：' + esc(t.extra) + '统一考试总分仍为 15 分。' +
        '第三类项目（乒乓球、羽毛球、网球、武术、体操）的评定标准与各项目场地器材要求见官方文件。' +
        '以上标准整理自上海市初中毕业升学体育统一考试项目成绩评价标准，实际以当年上海市教育考试院、市教委公布的官方文件为准。' +
        '<br>参考原文：<a href="https://www.163.com/dy/article/JON2HFRV0516K386.html" target="_blank" rel="noopener">最新上海中考体育评分标准（完整版）</a>' +
        ' ｜ 官方渠道：<a href="https://www.shmeea.edu.cn" target="_blank" rel="noopener">上海招考热线</a></p>';
  }
  function pageNoteHTML(){
    var y = examYear();
    return y + ' 年上海中考时间尚未由上海市教育考试院公布：第三级「正式考试」与第二级「外语听说测试、物理和化学实验操作」为按官方发布规律预估，闵行区体育统一测试时间暂未公布、先按 4 月 8 日，均可在设置中修改。' +
      '笔试时段与分值结构参照上海市教育考试院公布的 2026 年上海市初中学业水平考试安排（语文 9:00-10:40、综合测试笔试 14:00-16:00、历史开卷 16:50-17:30；外语笔试 9:00-10:30、数学 14:00-15:40、道德与法治开卷 16:30-17:10）。' +
      '成绩与日程请以「上海招考热线」shmeea.edu.cn 公布为准。';
  }

  /* ================= 渲染入口 ================= */
  var overlay = document.getElementById("overlay");
  var sheetBody = document.getElementById("sheetBody");
  var lastSig = "", lastToday = "";

  function applyTheme(){
    var t = state.theme;
    var resolved = t === "auto"
      ? ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light")
      : t;
    document.documentElement.setAttribute("data-theme", resolved);
    var icons = {
      light:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
      dark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
      auto:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>'
    };
    var btn = document.getElementById("themeBtn");
    btn.innerHTML = icons[t];
    btn.title = t === "auto" ? "主题：跟随系统（点击切换）" : "主题：" + (t === "dark" ? "深色" : "浅色") + "（点击切换）";
  }

  function renderToday(now){
    var el = document.getElementById("hero");
    el.innerHTML = heroHTML(now);
    if(msState(2, now) === "done") el.classList.add("is-over");
    else el.classList.remove("is-over");
  }
  function renderLevels(now){
    document.getElementById("levels").innerHTML = levelsHTML(now);
    lastSig = levelsSig(now);
  }
  function renderAll(){
    var now = new Date();
    renderToday(now);
    renderLevels(now);
    document.getElementById("cheerCard").innerHTML = cheerHTML();
    document.getElementById("scheduleTable").innerHTML = scheduleTableHTML(now);
    document.getElementById("scoreTable").innerHTML = scoreTableHTML();
    document.getElementById("peBody").innerHTML = peHTML();
    document.getElementById("schedCount").textContent = "共 " + scheduleRows(now).length + " 项";
    document.getElementById("pageNote").textContent = pageNoteHTML();
    document.getElementById("brandSub").textContent = examYear() + " 年上海中考 · 三级倒计时";
    syncAcc();
    lastToday = now.toDateString();
  }
  // 折叠分区：按上次状态展开/收起
  function syncAcc(){
    var list = document.querySelectorAll("details.acc");
    for(var i = 0; i < list.length; i++){
      var k = list[i].getAttribute("data-acc");
      if(k && state.acc) list[i].open = !!state.acc[k];
    }
  }
  document.addEventListener("toggle", function(ev){
    var d = ev.target;
    if(!d || d.tagName !== "DETAILS" || !d.classList || !d.classList.contains("acc")) return;
    var k = d.getAttribute("data-acc");
    if(!k || !state.acc) return;
    state.acc[k] = d.open;
    save();
  }, true);

  /* ================= 每秒更新 ================= */
  function tick(){
    var now = new Date();
    if(now.toDateString() !== lastToday){ renderAll(); return; }
    if(levelsSig(now) !== lastSig){ renderAll(); return; }
    function paint(prefix, i){
      if(msState(i, now) === "done") return;
      var target = msTarget(i), el;
      if(!target) return;
      var p = parts(target - now);
      if((el = document.getElementById(prefix + "d"))) el.textContent = p.d;
      if((el = document.getElementById(prefix + "h"))) el.textContent = pad(p.h);
      if((el = document.getElementById(prefix + "m"))) el.textContent = pad(p.m);
      if((el = document.getElementById(prefix + "s"))) el.textContent = pad(p.s);
      var w = weeksOf(target - now);
      if((el = document.getElementById(prefix + "w"))) el.textContent = w.text;
      if((el = document.getElementById(prefix + "f"))) el.textContent = w.frac;
    }
    paint("hv", 2);
    paint("lv0", 0);
    paint("lv1", 1);
  }

  /* ================= 设置面板 ================= */
  function settingsHTML(){
    var rows = state.milestones.map(function(m, i){
      var rank = ["第一级","第二级","第三级"][i] || ("第" + (i+1) + "级");
      return '<div class="mrow">' +
        '<label><span>' + rank + ' 名称</span>' +
          '<input type="text" value="' + esc(m.name) + '" data-act="m-name" data-i="' + i + '"></label>' +
        '<label><span>日期时间</span>' +
          '<input type="datetime-local" value="' + esc(m.date) + '" data-act="m-date" data-i="' + i + '"></label>' +
        '<label class="chk"><input type="checkbox" data-act="m-tbd" data-i="' + i + '"' + (m.tbd ? " checked" : "") + '><span>时间待定</span></label>' +
        '<label class="wide"><span>备注</span>' +
          '<input type="text" value="' + esc(m.note) + '" data-act="m-note" data-i="' + i + '"></label>' +
      '</div>';
    }).join("");

    var themes = [["light","浅色"],["dark","深色"],["auto","跟随系统"]].map(function(t){
      return '<button type="button" data-act="theme" data-theme="' + t[0] + '" aria-pressed="' + (state.theme === t[0]) + '">' + t[1] + '</button>';
    }).join("");

    return '' +
      '<div class="sect">' +
        '<h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>三级日期</h3>' +
        rows +
        '<div class="hint">勾选「时间待定」的级别只按日期倒计时（倒计时对准当天 0 点）。' +
          '第三级日期同时决定笔试场次：第 1 天为语文、综合测试笔试、历史，第 2 天为外语笔试、数学、道德与法治，时段按考试院公布的安排固定。</div>' +
      '</div>' +
      '<div class="sect">' +
        '<h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>外观</h3>' +
        '<div class="seg" role="group" aria-label="主题">' + themes + '</div>' +
        '<div class="hint">所有设置自动保存在本机浏览器中。</div>' +
      '</div>';
  }

  var lastFocus = null;
  function openSettings(){
    lastFocus = document.activeElement;
    sheetBody.innerHTML = settingsHTML();
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    var first = sheetBody.querySelector("input,button");
    if(first) first.focus({preventScroll:true});
  }
  function closeSettings(){
    overlay.hidden = true;
    document.body.style.overflow = "";
    renderAll();
    if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  }

  /* ================= 事件 ================= */
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act]");
    if(!t) return;
    var act = t.getAttribute("data-act");

    if(act === "open-settings"){ openSettings(); return; }
    if(act === "close-settings"){ closeSettings(); return; }
    if(act === "goto-details"){
      var firstAcc = document.querySelector('details.acc[data-acc="sched"]');
      if(firstAcc && !firstAcc.open) firstAcc.open = true;
      var box = document.getElementById("details");
      if(box && box.scrollIntoView) box.scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }
    if(act === "pe-sex"){
      state.peSex = t.getAttribute("data-sex");
      save();
      document.getElementById("peBody").innerHTML = peHTML();
      return;
    }
    if(act === "swap-photo"){
      var key = new Date().toDateString();
      state.photoOffset = (state.photoDate === key ? (state.photoOffset || 0) : 0) + 1;
      state.photoDate = key;
      save();
      renderToday(new Date());
      return;
    }
    if(act === "cycle-theme"){
      state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
      applyTheme(); save();
      if(!overlay.hidden) sheetBody.innerHTML = settingsHTML();
      return;
    }
    if(act === "theme"){
      state.theme = t.getAttribute("data-theme");
      applyTheme(); save();
      sheetBody.innerHTML = settingsHTML();
      return;
    }
    if(act === "reset-all"){
      if(!window.confirm("恢复默认日期？三级日期与备注将回到初始值。")) return;
      state = {
        milestones: defMilestones(), theme: state.theme,
        photoOffset: state.photoOffset, photoDate: state.photoDate,
        peSex: state.peSex, acc: state.acc
      };
      save();
      renderAll();
      sheetBody.innerHTML = settingsHTML();
      return;
    }
  });

  overlay.addEventListener("click", function(ev){ if(ev.target === overlay) closeSettings(); });
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape" && !overlay.hidden) closeSettings(); });

  document.addEventListener("input", function(ev){
    var t = ev.target;
    var act = t.getAttribute && t.getAttribute("data-act");
    if(!act) return;
    var i = +t.getAttribute("data-i");
    var m = state.milestones[i];
    if(!m) return;

    if(act === "m-name"){ m.name = t.value; save(); renderAll(); return; }
    if(act === "m-note"){ m.note = t.value; save(); renderAll(); return; }
    if(act === "m-tbd"){ m.tbd = !!t.checked; save(); renderAll(); return; }
    if(act === "m-date"){
      if(!parse(t.value)) return;
      m.date = t.value;
      save(); renderAll();
      return;
    }
  });

  if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(state.theme === "auto") applyTheme();
    });
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });

  applyTheme();
  renderAll();
  tick();
  setInterval(tick, 1000);
})();
</script>
<script>
(function(){
  // 只在通过网址（http/https）打开时注册离线缓存；本地双击打开会自动跳过
  if(!("serviceWorker" in navigator) || location.protocol.indexOf("http") !== 0) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
})();
</script>
</body>
